<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="product-rating">
        <p>Rate this flower:</p>

        <div class="stars">
            <button data-rating="1" aria-label="Rate 1 star">★</button>
            <button data-rating="2" aria-label="Rate 2 stars">★</button>
            <button data-rating="3" aria-label="Rate 3 stars">★</button>
            <button data-rating="4" aria-label="Rate 4 stars">★</button>
            <button data-rating="5" aria-label="Rate 5 stars">★</button>
        </div>

        <p class="rating-message"></p>
    </div>
</body>

</html>
